spring.application.name=pixelbyte-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pixelbyte_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.jwt-secret=${JWT_SECRET:}
app.google-client-id=${GOOGLE_CLIENT_ID:}
app.cookie-secure=${COOKIE_SECURE:false}
app.demo-password=${DEMO_PASSWORD:}
